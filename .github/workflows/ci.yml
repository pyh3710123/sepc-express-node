name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run openapi:check
      - run: npm run build

  unit:
    name: Unit and HTTP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  integration:
    name: PostgreSQL and Redis integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aimanju
          POSTGRES_USER: aimanju
          POSTGRES_PASSWORD: aimanju
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aimanju -d aimanju"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://aimanju:aimanju@localhost:5432/aimanju
      REDIS_URL: redis://localhost:6379
      DEV_MOCK_EXTERNALS: 'true'
      DEV_SMS_CODE: '123456'
      TEST_DATABASE_URL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed:dev
      - run: npm run test:integration

  # 在远端分支保护中将 quality-gate 设为必需检查；跳过的任务也不能放行。
  quality-gate:
    name: quality-gate
    if: always()
    needs: [static, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          if [ "$STATIC_RESULT" != success ] || [ "$UNIT_RESULT" != success ] || [ "$INTEGRATION_RESULT" != success ]; then
            printf 'static=%s unit=%s integration=%s\n' "$STATIC_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT"
            exit 1
          fi
